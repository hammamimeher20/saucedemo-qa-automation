name: SauceDemo QA CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 2 * * *"   # régression nocturne à 02h00 UTC

jobs:
  smoke:
    name: Smoke Tests (Chrome headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Exécuter les tests smoke
        run: mvn -B test -Dgroups=smoke -DsuiteXmlFile=testng.xml

      - name: Publier le rapport ExtentReports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-smoke
          path: test-output/extent-reports/

  regression-cross-browser:
    name: Regression - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome-headless, firefox]
    steps:
      - uses: actions/checkout@v4

      - name: Configurer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Exécuter la régression sur ${{ matrix.browser }}
        run: mvn -B test -Dgroups=regression -Dbrowser=${{ matrix.browser }}

      - name: Publier le rapport ExtentReports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ matrix.browser }}
          path: test-output/extent-reports/
