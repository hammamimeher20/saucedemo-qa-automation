# Selenium Grid local via Docker, pour exécuter la suite sans navigateur installé
# en local (utile en CI/CD ou pour simuler un environnement de test distant).
#
# Démarrage :   docker compose up -d
# Exécution :   mvn test -Dgrid.url=http://localhost:4444/wd/hub -Dgroups=smoke
# VNC (debug) : http://localhost:7900  (mot de passe : secret)
# Arrêt :       docker compose down

services:
  selenium-hub:
    image: selenium/hub:4.24.0
    container_name: selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"

  chrome:
    image: selenium/node-chrome:4.24.0
    container_name: selenium-chrome
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
    ports:
      - "7900:7900"

  firefox:
    image: selenium/node-firefox:4.24.0
    container_name: selenium-firefox
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
    ports:
      - "7901:7900"
